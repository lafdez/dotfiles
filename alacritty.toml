
[general]
import = [ "/usr/lib/node_modules/alacritty-themes/themes/Breeze.toml" ]

[font]
size = 11

  [font.bold]
  family = "hack"
  style = "Bold"

  [font.bold_italic]
  family = "monospace"
  style = "Bold Italic"

  [font.italic]
  family = "hack"
  style = "Italic"

  [font.normal]
  family = "monospace"
  style = "Regular"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[scrolling]
history = 50_000

[window]
opacity = 0.8
